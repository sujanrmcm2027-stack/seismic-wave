name: Update Live Incidents

on:
  schedule:
    # Run at minute 15 and 45
    - cron: "15,45 * * * *"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update-incidents:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests feedparser gspread google-auth

      - name: Fetch Incidents and Update JSON
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PYEOF'
          import requests
          import feedparser
          import json
          import os
          import uuid
          from datetime import datetime, timezone
          import urllib.parse
          import random
          
          def generate_id():
              return f"live-{uuid.uuid4().hex[:8]}"

          def fetch_bipad():
              incidents = []
              try:
                  url = "https://bipadportal.gov.np/api/v1/incident/?limit=50"
                  headers = {"User-Agent": "Mozilla/5.0"}
                  response = requests.get(url, headers=headers, timeout=10)
                  if response.status_code == 200:
                      data = response.json().get('results', [])
                      for item in data:
                          # Filter for earthquake or structural related hazards if possible
                          hazard_name = item.get('hazard', {}).get('title', '').lower()
                          title = item.get('title', '')
                          desc = item.get('description', '') or ''
                          
                          if 'earthquake' in hazard_name or 'landslide' in hazard_name or 'fire' in hazard_name or 'structural' in hazard_name:
                              # Map to our DamageIncident schema
                              point = item.get('point', {})
                              coords = point.get('coordinates', [0, 0]) if point else [0, 0]
                              
                              if len(coords) == 2 and coords[0] != 0:
                                  lng, lat = coords[0], coords[1]
                                  
                                  category = "Landslide"
                                  if 'fire' in hazard_name:
                                      category = "Structural Failure"
                                  elif 'earthquake' in hazard_name:
                                      category = "Structural Failure"
                                  
                                  incidents.append({
                                      "id": generate_id(),
                                      "district": item.get('district', {}).get('title', 'Unknown') if item.get('district') else 'Unknown',
                                      "place": item.get('municipality', {}).get('title', 'Nepal') if item.get('municipality') else 'Nepal',
                                      "lat": lat,
                                      "lng": lng,
                                      "phase": "Aftermath",
                                      "category": category,
                                      "verification": "official",
                                      "source": "BIPAD Portal",
                                      "headline": title[:100],
                                      "detail": desc[:200] if desc else title,
                                      "time": item.get('incident_on', datetime.now(timezone.utc).isoformat())
                                  })
              except Exception as e:
                  print(f"BIPAD Error: {e}")
              return incidents

          def fetch_news():
              incidents = []
              try:
                  query = urllib.parse.quote("earthquake nepal OR landslide nepal")
                  url = f"https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en"
                  feed = feedparser.parse(url)
                  
                  for entry in feed.entries[:10]: # Top 10 news
                      title = entry.title
                      source = entry.source.title if hasattr(entry, 'source') else "News Portal"
                      
                      # Approximate location in Nepal (since news doesn't give coords, we jitter around KTM center)
                      lat = 27.7 + (random.random() - 0.5) * 2
                      lng = 85.3 + (random.random() - 0.5) * 2
                      
                      incidents.append({
                          "id": generate_id(),
                          "district": "Multiple",
                          "place": "Reported area",
                          "lat": lat,
                          "lng": lng,
                          "phase": "Aftermath",
                          "category": "Structural Failure" if 'earthquake' in title.lower() else "Landslide",
                          "verification": "media",
                          "source": source,
                          "headline": title[:100],
                          "detail": getattr(entry, 'summary', title)[:200],
                          "time": datetime.now(timezone.utc).isoformat()
                      })
              except Exception as e:
                  print(f"News Error: {e}")
              return incidents

          if __name__ == "__main__":
              bipad_incidents = fetch_bipad()
              news_incidents = fetch_news()
              
              all_incidents = bipad_incidents + news_incidents
              all_incidents.sort(key=lambda x: x['time'], reverse=True)
              
              output_path = "public/live_incidents.json"
              print(f"Found {len(bipad_incidents)} BIPAD incidents and {len(news_incidents)} news incidents.")
              
              with open(output_path, "w", encoding="utf-8") as f:
                  json.dump(all_incidents, f, ensure_ascii=False, indent=2)
              
              print(f"Written to {output_path}")
          PYEOF

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live_incidents.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update live_incidents.json [$(TZ='Asia/Kathmandu' date '+%Y-%m-%d %H:%M NPT')]"
            git pull --rebase
            git push
          fi

      - name: Update Google Sheets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -z "$GCP_CREDENTIALS" ] || [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "Google Sheets credentials not provided. Skipping."
            exit 0
          fi
          
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PYEOF'
          import os, json, gspread
          from google.oauth2.service_account import Credentials

          credentials_json = os.environ.get('GCP_CREDENTIALS', '{}')
          sheet_id = os.environ.get('GOOGLE_SHEET_ID')

          try:
              creds_dict = json.loads(credentials_json)
              scopes = ['https://www.googleapis.com/auth/spreadsheets']
              creds = Credentials.from_service_account_info(creds_dict, scopes=scopes)
              client = gspread.authorize(creds)
              
              sheet = client.open_by_key(sheet_id)
              
              try:
                  worksheet = sheet.worksheet("Incidents")
              except gspread.exceptions.WorksheetNotFound:
                  worksheet = sheet.add_worksheet(title="Incidents", rows="1000", cols="12")
                  worksheet.append_row(["Incident ID", "Time", "District", "Place", "Category", "Phase", "Headline", "Detail", "Source", "Lat", "Lng"])

              with open("public/live_incidents.json") as f:
                  incidents = json.load(f)
              
              if isinstance(incidents, dict) and "items" in incidents:
                  incidents = incidents["items"]
                  
              import subprocess
              old_incident_ids = set()
              try:
                  result = subprocess.run(['git', 'show', 'HEAD~1:public/live_incidents.json'], capture_output=True, text=True)
                  if result.returncode == 0:
                      old_data = json.loads(result.stdout)
                      if isinstance(old_data, dict) and "items" in old_data:
                          old_data = old_data["items"]
                      for item in old_data:
                          if isinstance(item, dict) and item.get("id"):
                              old_incident_ids.add(item.get("id"))
              except Exception as e:
                  print(f"Notice: Failed to fetch old data or no previous commit: {e}")
              
              rows_to_append = []
              for item in incidents:
                  incident_id = item.get("id", "")
                  
                  if incident_id in old_incident_ids:
                      continue # Already appended previously
                      
                  rows_to_append.append([
                      incident_id,
                      item.get("time", ""),
                      item.get("district", ""),
                      item.get("place", ""),
                      item.get("category", ""),
                      item.get("phase", ""),
                      item.get("headline", ""),
                      item.get("detail", ""),
                      item.get("source", ""),
                      item.get("lat", ""),
                      item.get("lng", "")
                  ])
              
              if rows_to_append:
                  worksheet.append_rows(rows_to_append, value_input_option='USER_ENTERED')
                  print(f"Successfully appended {len(rows_to_append)} rows to Incidents sheet.")
                  
          except Exception as e:
              print(f"Failed to update Google Sheets: {e}")
              sys.exit(1)
          PYEOF
