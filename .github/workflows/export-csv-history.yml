name: Export History to CSV

on: 
  schedule:
    # Run once a day at midnight NPT (18:15 UTC)
    - cron: "15 18 * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  export-csv-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # We need the full git history to extract all past records

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Extract History to CSV
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PYEOF'
          import os, json, subprocess, csv

          def get_file_commits(filepath):
              result = subprocess.run(['git', 'log', '--pretty=format:%H', '--', filepath], capture_output=True, text=True)
              return result.stdout.strip().split('\n')

          def get_file_content(commit_hash, filepath):
              try:
                  result = subprocess.run(['git', 'show', f'{commit_hash}:{filepath}'], capture_output=True, text=True, check=True)
                  return result.stdout
              except:
                  return None

          print("Extracting Infrastructure History...")
          infra_commits = get_file_commits('public/infra_status.json')
          infra_records = [["Timestamp", "Category", "Name", "Name (Nepali)", "Status", "Detail", "Last Updated"]]
          
          if infra_commits and infra_commits != ['']:
              # Reverse to chronologically append from oldest to newest
              for commit in reversed(infra_commits):
                  content = get_file_content(commit, 'public/infra_status.json')
                  if not content: continue
                  try:
                      data = json.loads(content)
                      generated_at = data.get("generatedAt", "")
                      for item in data.get("items", []):
                          infra_records.append([
                              generated_at, item.get("category", ""), item.get("name", ""),
                              item.get("nameNe", ""), item.get("status", ""), item.get("detail", ""),
                              item.get("lastUpdated", "")
                          ])
                  except:
                      pass
                      
          print("Extracting Incidents History...")
          inc_commits = get_file_commits('public/live_incidents.json')
          inc_records = [["Incident ID", "Time", "District", "Place", "Category", "Phase", "Headline", "Detail", "Source", "Lat", "Lng"]]
          
          if inc_commits and inc_commits != ['']:
              for commit in reversed(inc_commits):
                  content = get_file_content(commit, 'public/live_incidents.json')
                  if not content: continue
                  try:
                      data = json.loads(content)
                      if isinstance(data, dict) and "items" in data: data = data["items"]
                      for item in data:
                          inc_records.append([
                              item.get("id", ""), item.get("time", ""), item.get("district", ""),
                              item.get("place", ""), item.get("category", ""), item.get("phase", ""),
                              item.get("headline", ""), item.get("detail", ""), item.get("source", ""),
                              item.get("lat", ""), item.get("lng", "")
                          ])
                  except:
                      pass

          # Save to CSV
          try:
              if len(infra_records) > 1:
                  with open('infra_history.csv', 'w', newline='', encoding='utf-8') as f:
                      writer = csv.writer(f)
                      writer.writerows(infra_records)
                  print(f"Saved {len(infra_records)} rows to infra_history.csv")
                  
              if len(inc_records) > 1:
                  with open('incidents_history.csv', 'w', newline='', encoding='utf-8') as f:
                      writer = csv.writer(f)
                      writer.writerows(inc_records)
                  print(f"Saved {len(inc_records)} rows to incidents_history.csv")
                  
              print("Export complete!")
          except Exception as e:
              print(f"Failed to save CSVs: {e}")
              sys.exit(1)
          PYEOF

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra_history.csv incidents_history.csv
          if git diff --staged --quiet; then
            echo "No new historical data to commit."
          else
            git commit -m "data: update history CSVs [$(TZ='Asia/Kathmandu' date '+%Y-%m-%d NPT')]"
            git pull --rebase
            git push
          fi
